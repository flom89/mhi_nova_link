name: Validate with hassfest

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - uses: "actions/checkout@v7"
      # Pinned to latest commit on master as of 2026-08-03.
      # Update this SHA when a newer hassfest release is available.
      - uses: "home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6"

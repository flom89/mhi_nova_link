[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhi-nova"
version = "0.1.0"
description = "Custom Home Assistant integration for NOVA_RC gateways"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Discover tests in all three suites.
# Run a specific suite with: pytest tests/unit  |  pytest tests/integration  |  pytest tests/functional
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/functional",
]
